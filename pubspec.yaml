name: avibiotech_mobile
description: Application mobile pour la gestion avicole intelligente - AVIBIOTECH
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.6
  
  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.17.3
  firebase_storage: ^11.7.5
  firebase_messaging: ^14.7.19
  
  # State Management
  provider: ^6.1.1
  
  # Local Storage & Offline
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2
  
  # Utilitaires
  intl: ^0.19.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  connectivity_plus: ^5.0.2
  
  # Animations
  lottie: ^2.7.0
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/logo.png